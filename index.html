<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 0-1: HTML基礎確認</title>
     <script>
        function updateClock() {
            // 現在時刻を取得
            var now = new Date();
            var hours = now.getHours();
            var minutes = now.getMinutes();
            var seconds = now.getSeconds();
            
            // 1桁の場合は0を付ける
            if (hours < 10) hours = '0' + hours;
            if (minutes < 10) minutes = '0' + minutes;
            if (seconds < 10) seconds = '0' + seconds;
            
            // 時刻を表示
            var timeString = hours + ':' + minutes + ':' + seconds;
            document.getElementById('clock').innerHTML = timeString;
        }
        
        // 1秒ごとにupdateClock関数を実行
        setInterval(updateClock, 1000);
        
        // ページ読み込み時に即座に表示
        window.onload = updateClock;
    </script>
</head>
<body>
    <h1>現在時刻</h1>
    <div id="clock" style="font-size: 48px; font-weight: bold; color: black; background-color: lightgray;">
        00:00:00
    </div>
    <img src="https://cdn.pakutaso.com/shared/img/thumb/04kissaten22_TP_V.jpg" width="500" alt="籠に置かれた茶色い卵(PAKUTASOより)">
    <h1>Phase 0-1: HTML基礎確認</h1>
    <div>
        <h2>お薦めな食べ物を紹介</h2>
        <p>　お薦めな食べ物は卵です。各種栄養素が豊富であってかつ調理の自由度が高く、それでいて安価な食品は珍しいでしょう。特に日本の基準で生産された卵であれば生食もできるため、そのまま食すこともできますし、焼く、茹でる、炒める、泡立てるなど様々な調理法を用いることができます。</p>
    </div>
    <div>
        <h2>リンク</h2>
        <p>お薦めな旅行先のリンクはこちら：</p>
        <ul>
            <a href="second.html">お薦めな旅行先</a>
        </ul>

</body>
</html>
